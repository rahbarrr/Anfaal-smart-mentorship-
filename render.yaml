services:
  # ────────────────────────────────────────────────────────────────────────────
  # Anfaal Backend Service (100% Free Tier — No credit card required)
  # ────────────────────────────────────────────────────────────────────────────
  - type: web
    name: anfaal-api
    runtime: node
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: RUN_WORKER
        value: "false"
      - key: CLIENT_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: AWS_REGION
        value: ap-south-1
      - key: AWS_ENDPOINT
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: STORAGE_BUCKET
        value: anfaal-recordings
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_TRANSCRIPTION_MODEL
        value: whisper-1
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: BOOTSTRAP_ADMIN_EMAIL
        value: admin@anfaalfoundation.com
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false

  # Dedicated BullMQ worker. The API service must never process audio/AI inline.
  - type: worker
    name: anfaal-call-worker
    runtime: node
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run worker
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: WORKER_CONCURRENCY
        value: "3"
      - key: DISABLE_REDIS
        value: "false"
      - key: AWS_REGION
        value: ap-south-1
      - key: AWS_ENDPOINT
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: STORAGE_BUCKET
        value: anfaal-recordings
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_TRANSCRIPTION_MODEL
        value: whisper-1
      - key: OPENAI_MODEL
        value: gpt-4o-mini
