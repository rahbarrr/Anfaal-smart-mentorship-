version: '3.8'

services:
  mongo:
    image: mongo:7.0
    container_name: anfaal-staging-db
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - staging_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: anfaal-staging-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: anfaal-staging-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/anfaal_staging
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-anfaal-staging-secret-jwt-key-2026}
      - CLIENT_URL=${CLIENT_URL:-http://localhost:3000,http://localhost:8080}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - OPENAI_TRANSCRIPTION_MODEL=${OPENAI_TRANSCRIPTION_MODEL:-whisper-1}
      - STORAGE_BUCKET=${STORAGE_BUCKET:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_REGION=${AWS_REGION:-ap-south-1}
      - NODE_ENV=staging
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["node", "dist/worker.js"]
    container_name: anfaal-staging-worker
    restart: unless-stopped
    environment:
      - MONGODB_URI=mongodb://mongo:27017/anfaal_staging
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-anfaal-staging-secret-jwt-key-2026}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - OPENAI_TRANSCRIPTION_MODEL=${OPENAI_TRANSCRIPTION_MODEL:-whisper-1}
      - STORAGE_BUCKET=${STORAGE_BUCKET:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_REGION=${AWS_REGION:-ap-south-1}
      - NODE_ENV=staging
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_started

  next-app:
    build:
      context: ./next-app
      dockerfile: Dockerfile
    container_name: anfaal-staging-next
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - BACKEND_API_URL=http://backend:5000
      - NEXT_PUBLIC_API_URL=http://localhost:5000
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
    depends_on:
      - backend

  legacy-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: anfaal-staging-legacy-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    profiles:
      - legacy-comparison
    depends_on:
      - backend

volumes:
  staging_mongo_data:
